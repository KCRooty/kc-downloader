name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pyflakes kcdl tests
      - run: python -m pytest -q tests

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          # El build de Linux va dentro de un contenedor Debian 12 (glibc 2.36): el
          # binario sirve en más distros y no depende de los mirrors de Ubuntu del
          # runner, que no respondían el día de la v3.0.0.
          - os: ubuntu-latest
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Build (app + herramientas oficiales con SHA-256)
        if: runner.os == 'Windows'
        run: python packaging/build.py

      - name: Autotest del ejecutable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:KCDL_HOME = "$env:RUNNER_TEMP\kcdl-selftest"
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist\KC Downloader\KC Downloader.exe" -ArgumentList "--selftest" -PassThru -Wait
          Get-Content "$env:KCDL_HOME\data\selftest.txt"
          if ($p.ExitCode -ne 0) { throw "selftest rc=$($p.ExitCode)" }
          if (Select-String -Path "$env:KCDL_HOME\data\selftest.txt" -Pattern "^(yt-dlp|ffmpeg|deno): falta|^https: fallo") { throw "faltan herramientas en el bundle" }

      - name: Build y autotest X11 (Linux, contenedor Debian 12)
        if: runner.os == 'Linux'
        timeout-minutes: 25
        run: docker run --rm -v "$PWD:/src" -w /src python:3.12-slim-bookworm bash packaging/linux/ci-build.sh

      # Otra distro distinta a la que compila: aquí salieron los certificados SSL
      # y las librerías xcb que faltaban (CachyOS/Arch).
      - name: Autotest en Arch Linux (contenedor limpio)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" archlinux:latest bash -c '
            set -e
            pacman -Sy --noconfirm --needed mesa libglvnd fontconfig libx11 libxkbcommon xorg-server-xvfb xorg-xauth >/dev/null
            useradd -m amigo
            su - amigo -c "tar xf /dist/*.tar.gz && cd \"KC Downloader\" && export KCDL_HOME=\$HOME/h QT_QPA_PLATFORM=xcb && xvfb-run -a ./kc-downloader --selftest && cat \$HOME/h/data/selftest.txt && ! grep -E \"^(yt-dlp|ffmpeg|deno): falta|^https: fallo\" \$HOME/h/data/selftest.txt"
          '

      # Informativo: YouTube bloquea a menudo las IP de los runners de GitHub («no soy un bot»).
      - name: Descargas reales con solo el bundle
        continue-on-error: true
        env:
          KCDL_E2E: '1'
          KCDL_E2E_STRICT: '1'
        shell: bash
        run: KCDL_E2E_BUNDLE="$PWD/dist/KC Downloader/tools" python -m pytest -q tests/test_e2e.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Notas desde CHANGELOG.md
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" 'index($0, "## [v" v "]") == 1 || index($0, "## [" v "]") == 1 {f=1; next} f && /^## \[/ {exit} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md no tiene sección para $ver"; exit 1; }
      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" out/*/* --title "KC Downloader $GITHUB_REF_NAME" --notes-file notes.md
