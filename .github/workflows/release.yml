name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pyflakes kcdl tests
      - run: python -m pytest -q tests

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          # 22.04: glibc más antigua = el binario funciona en más distros
          - os: ubuntu-22.04
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bibliotecas X11 para el bundle de Linux
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          # El mirror de Azure de los runners a veces no resuelve (visto en v3.0.0):
          # se usa el de Ubuntu directamente, con reintentos y tiempos cortos.
          sudo sed -i -E 's#(mirror\+file:/etc/apt/apt-mirrors.txt|https?://azure\.archive\.ubuntu\.com/ubuntu/?)#http://archive.ubuntu.com/ubuntu/#g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          APT="-o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          sudo apt-get $APT update -q
          sudo apt-get $APT install -y -q libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-image0 libxcb-render-util0 libxkbcommon-x11-0 libegl1 xvfb

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Build (app + herramientas oficiales con SHA-256)
        run: python packaging/build.py

      - name: Autotest del ejecutable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:KCDL_HOME = "$env:RUNNER_TEMP\kcdl-selftest"
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist\KC Downloader\KC Downloader.exe" -ArgumentList "--selftest" -PassThru -Wait
          Get-Content "$env:KCDL_HOME\data\selftest.txt"
          if ($p.ExitCode -ne 0) { throw "selftest rc=$($p.ExitCode)" }
          if (Select-String -Path "$env:KCDL_HOME\data\selftest.txt" -Pattern "^(yt-dlp|ffmpeg|deno): falta|^https: fallo") { throw "faltan herramientas en el bundle" }

      - name: Autotest del ejecutable (Linux, X11)
        if: runner.os == 'Linux'
        run: |
          export KCDL_HOME="$RUNNER_TEMP/kcdl-selftest" QT_QPA_PLATFORM=xcb
          xvfb-run -a "dist/KC Downloader/kc-downloader" --selftest
          cat "$KCDL_HOME/data/selftest.txt"
          ! grep -E "^(yt-dlp|ffmpeg|deno): falta|^https: fallo" "$KCDL_HOME/data/selftest.txt"

      # Otra distro distinta a la que compila: aquí salieron los certificados SSL
      # y las librerías xcb que faltaban (CachyOS/Arch).
      - name: Autotest en Arch Linux (contenedor limpio)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" archlinux:latest bash -c '
            set -e
            pacman -Sy --noconfirm --needed mesa libglvnd fontconfig libx11 libxkbcommon xorg-server-xvfb xorg-xauth >/dev/null
            useradd -m amigo
            su - amigo -c "tar xf /dist/*.tar.gz && cd \"KC Downloader\" && export KCDL_HOME=\$HOME/h QT_QPA_PLATFORM=xcb && xvfb-run -a ./kc-downloader --selftest && cat \$HOME/h/data/selftest.txt && ! grep -E \"^(yt-dlp|ffmpeg|deno): falta|^https: fallo\" \$HOME/h/data/selftest.txt"
          '

      # Informativo: YouTube bloquea a menudo las IP de los runners de GitHub («no soy un bot»).
      - name: Descargas reales con solo el bundle
        continue-on-error: true
        env:
          KCDL_E2E: '1'
          KCDL_E2E_STRICT: '1'
        shell: bash
        run: KCDL_E2E_BUNDLE="$PWD/dist/KC Downloader/tools" python -m pytest -q tests/test_e2e.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Notas desde CHANGELOG.md
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" 'index($0, "## [v" v "]") == 1 || index($0, "## [" v "]") == 1 {f=1; next} f && /^## \[/ {exit} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md no tiene sección para $ver"; exit 1; }
      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" out/*/* --title "KC Downloader $GITHUB_REF_NAME" --notes-file notes.md
